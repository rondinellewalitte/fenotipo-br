[project]
name = "hpolab"
version = "0.1.0"
description = "Research lab: mapping Brazilian Portuguese clinical text to HPO terms"
readme = "README.md"
authors = [
    { name = "Rondinelle Walitte", email = "rondinellewalitte@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "scipy>=1.11",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: tests that need files downloaded into data/raw/"]
